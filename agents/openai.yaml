interface:
  display_name: "Apply Harness Engineering"
  short_description: "Audit and adopt a repository harness safely"
  default_prompt: "Use the globally installed $apply-harness-engineering for the named repository: audit first, classify it using the skill's adoption-state rules, perform a fresh adoption only when no harness markers exist, otherwise migrate the existing or partial adoption incrementally, use the optional model-and-agent runtime and eval contracts when an AI runtime applies, default to manual task-completion revalidation without hosted workflow changes, do not use certification by default, and enable the optional strict attestation only when explicitly requested; run project-native and bundled checks, report CERT000 only after real strict certification succeeds, and do not create branches, commit, or push unless explicitly authorized."
policy:
  allow_implicit_invocation: false
